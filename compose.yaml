services:
  triage:
    build: .
    init: true
    env_file: .env
    environment:
      DUMP_DIR: /data/dumps
      REPORT_DIR: /data/reports
    volumes:
      - ./dumps:/data/dumps:ro
      - ./reports:/data/reports
      - ./workflows:/app/workflows:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 4m
